name: Publish Wolverine Nugets

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
          
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run Pack
        run: ./build.sh pack
        shell: bash

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # Trusted Publishing still needs the nuget.org profile name,
          # but the API key is exchanged dynamically via GitHub OIDC.
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        shell: bash
        run: |
          find ./artifacts -name '*.nupkg' -exec dotnet nuget push "{}" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate \;
